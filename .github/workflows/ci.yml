# CI cutover: self-hosted раннеры сняты с организации (0 живых), а ruleset
# «Protect master» требует контекст «Required CI». Этот workflow переводит
# проверки на GitHub-hosted и эмитит требуемый контекст одним стабильным
# джобом-агрегатором — состав matrix может меняться без правки ruleset.
# Toolchain здесь совпадает с текущим master (pnpm 10.30.3, Node 20/24);
# обновление до Node >=22.14 приезжает отдельным PR стека r0.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '20'
          - os: ubuntu-latest
            node: '24'
          - os: windows-latest
            node: '24'

    steps:
      # Third-party actions закреплены commit SHA; tag — только биография.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # hand-baseline читает руку из истории — нужна полная глубина.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          # Дословно совпадает с package.json#packageManager.
          version: 10.30.3
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Один список обязательных проверок живёт в package.json#scripts.verify.
      - name: Verify repository, geometry, package and tests
        run: pnpm verify

      # Bite-тесты гардов выполняются один раз на основной LTS: их задача —
      # доказать запрещающую ветку guard, а не повторить platform matrix.
      - name: Parity guard bites on extra icon
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        shell: bash
        run: |
          cp svg/Filled/accessibility_filled.svg svg/Filled/_EXTRA_TEST_filled.svg
          trap 'rm -f svg/Filled/_EXTRA_TEST_filled.svg' EXIT
          if pnpm check:parity; then
            echo "ERROR: parity should have failed"
            exit 1
          fi

      - name: Colour guard bites on hardcoded hex
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        shell: bash
        run: |
          echo '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#101012"><path d="M0 0"/></svg>' \
            > dist/svg/Filled/_colour_test.svg
          trap 'rm -f dist/svg/Filled/_colour_test.svg' EXIT
          if pnpm check:colors; then
            echo "ERROR: colours should have failed"
            exit 1
          fi

  # Внешний ruleset требует один стабильный контекст «Required CI»; агрегатор
  # позволяет менять matrix без правки protected-настроек.
  required:
    name: Required CI
    if: ${{ always() }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require the entire verification matrix
        env:
          MATRIX_RESULT: ${{ needs.verify.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MATRIX_RESULT" == 'success' ]]
