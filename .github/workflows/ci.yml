name: CI

on:
  push:
    branches: [main]
  # Stacked PR тоже обязан получить доказательство exact head SHA.
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.14.0'
          - os: ubuntu-latest
            node: '24'
          - os: ubuntu-latest
            node: '26'
          # Windows проверяет pnpm.cmd и shell/пути пакета; macOS — нативные зависимости сборки.
          - os: windows-latest
            node: '24'
          - os: macos-latest
            node: '24'

    steps:
      # Все third-party actions закреплены commit SHA; tag используется только
      # как человекочитаемая биография обновления.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Observatory сравнивает generated с доказанным hand blob из history.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          # Дословно совпадает с package.json#packageManager; repo-contract
          # запрещает второй источник версии.
          version: 11.13.1
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Один список обязательных проверок живёт в package.json#scripts.verify.
      - name: Verify repository, geometry, package and tests
        run: pnpm verify

      # Bite tests выполняются один раз на основной LTS: сначала доказывают
      # исправность guard на чистом дереве, затем — его запрещающую ветку.
      - name: Parity guard bites on extra icon
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        shell: bash
        run: |
          pnpm check:parity
          cp svg/Filled/accessibility_filled.svg svg/Filled/_EXTRA_TEST_filled.svg
          trap 'rm -f svg/Filled/_EXTRA_TEST_filled.svg' EXIT
          set +e
          parity_output="$(pnpm check:parity 2>&1)"
          parity_status=$?
          set -e
          printf '%s\n' "$parity_output"
          if [[ "$parity_status" -eq 0 ]]; then
            echo "ERROR: parity accepted the injected extra icon"
            exit 1
          fi
          grep -F -- '_EXTRA_TEST' <<<"$parity_output"

      - name: Colour guard bites on hardcoded hex
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        shell: bash
        run: |
          pnpm check:colors
          echo '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#101012"><path d="M0 0"/></svg>' \
            > dist/svg/Filled/_colour_test.svg
          trap 'rm -f dist/svg/Filled/_colour_test.svg' EXIT
          set +e
          colour_output="$(pnpm check:colors 2>&1)"
          colour_status=$?
          set -e
          printf '%s\n' "$colour_output"
          if [[ "$colour_status" -eq 0 ]]; then
            echo "ERROR: colour guard accepted the injected hardcoded colour"
            exit 1
          fi
          grep -F -- '_colour_test.svg' <<<"$colour_output"

  # Уязвимости зависимостей, ошибки конфигурации и секреты в дереве кандидата.
  # Исключение — только запись в .trivyignore.yaml; уязвимость с исправлением блокирует всегда.
  security:
    name: Безопасность
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Получение исходников
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Проверка зависимостей, конфигурации и секретов
        run: |
          set -euo pipefail
          # trivy читает переменные TRIVY_* как флаги: охват проверки задаёт только этот шаг.
          unset "${!TRIVY_@}"
          version=0.74.0
          sum=2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
          dir="$RUNNER_TEMP/trivy"
          mkdir -p "$dir"
          curl -fsSL --retry 3 --retry-all-errors -o "$dir/trivy.tgz" \
            "https://github.com/aquasecurity/trivy/releases/download/v$version/trivy_${version}_Linux-64bit.tar.gz"
          echo "$sum  $dir/trivy.tgz" | sha256sum -c -
          tar -xzf "$dir/trivy.tgz" -C "$dir" trivy
          accepted=(--ignorefile /dev/null)
          [ -f .trivyignore.yaml ] && accepted=(--ignorefile .trivyignore.yaml)
          # Настройки сканера задаёт шаг: trivy.yaml из проверяемого дерева их не меняет.
          scan() { "$dir/trivy" fs --config /dev/null --cache-dir "$dir/cache" --exit-code 1 --no-progress "$@" .; }
          scan --scanners vuln,misconfig --severity UNKNOWN,HIGH,CRITICAL --include-dev-deps "${accepted[@]}"
          # Исправление вышло — принятая раньше уязвимость снова блокирует.
          scan --scanners vuln --severity UNKNOWN,HIGH,CRITICAL --include-dev-deps --ignore-unfixed --ignorefile /dev/null
          # Секрет в тестах, примерах и документации — такая же утечка: встроенные исключения trivy для них сняты.
          printf 'disable-allow-rules:\n  - tests\n  - examples\n  - markdown\n' > "$dir/secret.yaml"
          scan --scanners secret --secret-config "$dir/secret.yaml" "${accepted[@]}"

  # Внешний ruleset не должен знать о составе matrix. Один стабильный check
  # разрешает менять поддерживаемые Node/OS только вместе с версионируемым CI,
  # не оставляя защиту main привязанной к устаревающим именам job.
  required:
    name: CI
    if: ${{ always() }}
    needs: [verify, security]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Проверка итогов матрицы и безопасности
        env:
          MATRIX_RESULT: ${{ needs.verify.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MATRIX_RESULT" == 'success' && "$SECURITY_RESULT" == 'success' ]]
