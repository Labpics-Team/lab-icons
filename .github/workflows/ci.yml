name: CI

on:
  push:
    branches: [master]
   # Stacked PR тоже обязан полу чить доказательство exact h ead SHA.
  pull_request:
  merge_group:

perm issions:
  contents: read

concurrency:
  gro up: ci-${{ github.workflow }}-${{ github.ref  }}
  cancel-in-progress: true

jobs:
  verify :
    name: Verify ${{ matrix.os }} / Node ${ { matrix.node }}
    runs-on: ${{ matrix.os } }
    timeout-minutes: 30
    strategy:
       fail-fast: false
      matrix:
        inclu de:
          - os: self-hosted
            n ode: '22.14.0'
          - os: self-hosted
             node: '24'
          - os: self-hos ted
            node: '26'
          - os: wi ndows-latest
            node: '24'
           - os: macos-latest
            node: '24'

     steps:
      # Все third-party actions  закреплены commit SHA; tag испо льзуется только
      # как  человекочитаемая биогра фия обновления.
      - name: Ch eckout
        uses: actions/checkout@9c091bb 21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
         with:
          # Observatory срав� �ивает generated с доказанным  hand blob из history.
          fetch-dept h: 0
          persist-credentials: false

       - name: Setup pnpm
        uses: pnpm/act ion-setup@0ebf47130e4866e96fce0953f49152a6119 0b271 # v6.0.9
        with:
          # До словно совпадает с package.js on#packageManager; repo-contract
          #  запрещает второй источн� �к версии.
          version: 11.13.1
           dest: ${{ runner.temp }}/setup-pnpm 

      - name: Setup Node.js
        uses: a ctions/setup-node@820762786026740c76f36085b0e fc47a31fe5020 # v7.0.0
        with:
           node-version: ${{ matrix.node }}
           package-manager-cache: false

      - name: I nstall dependencies
        run: pnpm install  --frozen-lockfile

      # Один спис ок обязательных проверо� � живёт в package.json#scripts.verify.
       - name: Verify repository, geometry, pa ckage and tests
        run: pnpm verify

       # Bite tests выполняются оди н раз на основной LTS: их з� �дача — доказать
      # зап рещающую ветку guard, а не п овторить platform matrix.
      - nam e: Parity guard bites on extra icon
        i f: matrix.os == 'self-hosted' && matrix.node  == '24'
        shell: bash
        run: |
           cp svg/Filled/accessibility_filled.sv g svg/Filled/_EXTRA_TEST_filled.svg
           trap 'rm -f svg/Filled/_EXTRA_TEST_filled.sv g' EXIT
          if pnpm check:parity; then
             echo "ERROR: parity should have f ailed"
            exit 1
          fi

       - name: Colour guard bites on hardcoded hex
         if: matrix.os == 'self-hosted' && mat rix.node == '24'
        shell: bash
         run: |
          echo '<svg xmlns="http://www .w3.org/2000/svg" viewBox="0 0 24 24" fill="# 101012"><path d="M0 0"/></svg>' \
             > dist/svg/Filled/_colour_test.svg
           trap 'rm -f dist/svg/Filled/_colour_test.svg ' EXIT
          if pnpm check:colors; then
             echo "ERROR: colours should have f ailed"
            exit 1
          fi

  # � �нешний ruleset не должен зн� �ть о составе matrix. Один ст абильный check
  # разрешает  менять поддерживаемые No de/OS только вместе с верси онируемым CI,
  # не оставл� �я защиту master привязанно� � к устаревающим именам jo b.
  required:
    name: Required CI
    if:  ${{ always() }}
    needs: verify
    runs-on : self-hosted
    timeout-minutes: 2
    perm issions: {}
    steps:
      - name: Require  the entire verification matrix
        env:
           MATRIX_RESULT: ${{ needs.verify.resu lt }}
        shell: bash
        run: |
           set -euo pipefail
          [[ "$MATRIX _RESULT" == 'success' ]]
 