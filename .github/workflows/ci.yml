name: CI

on:
  push:
    branches: [main]
  # Stacked PR тоже обязан получить доказательство exact head SHA.
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.14.0'
          - os: ubuntu-latest
            node: '24'
          - os: ubuntu-latest
            node: '26'
          # Windows проверяет pnpm.cmd и shell/пути пакета; macOS — нативные зависимости сборки.
          - os: windows-latest
            node: '24'
          - os: macos-latest
            node: '24'

    steps:
      # Все third-party actions закреплены commit SHA; tag используется только
      # как человекочитаемая биография обновления.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Observatory сравнивает generated с доказанным hand blob из history.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          # Дословно совпадает с package.json#packageManager; repo-contract
          # запрещает второй источник версии.
          version: 11.13.1
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Временная диагностика PR #100; удалить до merge. Нет секретов или записи в Git.
      - name: Capture documentation diagnostic inputs
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 100 && matrix.os == 'ubuntu-latest' && matrix.node == '24'
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/docs-diagnostic"
          curl --fail --silent --show-error --location \
            'https://api.github.com/repos/Labpics-Team/lab-icons/check-runs/101393867405/annotations' \
            > "$RUNNER_TEMP/docs-diagnostic/previous-annotations.json"
          tar -czf "$RUNNER_TEMP/docs-diagnostic/dependencies.tar.gz" node_modules
          git bundle create "$RUNNER_TEMP/docs-diagnostic/source.bundle" HEAD
          git bundle verify "$RUNNER_TEMP/docs-diagnostic/source.bundle"
          (cd "$RUNNER_TEMP/docs-diagnostic" && sha256sum dependencies.tar.gz source.bundle > SHA256SUMS)

      - name: Preserve documentation diagnostic inputs
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 100 && matrix.os == 'ubuntu-latest' && matrix.node == '24'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docs-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docs-diagnostic/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      # Один список обязательных проверок живёт в package.json#scripts.verify.
      - name: Verify repository, geometry, package and tests
        run: pnpm verify

      # Bite tests выполняются один раз на основной LTS: сначала доказывают
      # исправность guard на чистом дереве, затем — его запрещающую ветку.
      - name: Parity guard bites on extra icon
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        shell: bash
        run: |
          pnpm check:parity
          cp svg/Filled/accessibility_filled.svg svg/Filled/_EXTRA_TEST_filled.svg
          trap 'rm -f svg/Filled/_EXTRA_TEST_filled.svg' EXIT
          set +e
          parity_output="$(pnpm check:parity 2>&1)"
          parity_status=$?
          set -e
          printf '%s\n' "$parity_output"
          if [[ "$parity_status" -eq 0 ]]; then
            echo "ERROR: parity accepted the injected extra icon"
            exit 1
          fi
          grep -F -- '_EXTRA_TEST' <<<"$parity_output"

      - name: Colour guard bites on hardcoded hex
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        shell: bash
        run: |
          pnpm check:colors
          echo '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#101012"><path d="M0 0"/></svg>' \
            > dist/svg/Filled/_colour_test.svg
          trap 'rm -f dist/svg/Filled/_colour_test.svg' EXIT
          set +e
          colour_output="$(pnpm check:colors 2>&1)"
          colour_status=$?
          set -e
          printf '%s\n' "$colour_output"
          if [[ "$colour_status" -eq 0 ]]; then
            echo "ERROR: colour guard accepted the injected hardcoded colour"
            exit 1
          fi
          grep -F -- '_colour_test.svg' <<<"$colour_output"

  # Внешний ruleset не должен знать о составе matrix. Один стабильный check
  # разрешает менять поддерживаемые Node/OS только вместе с версионируемым CI,
  # не оставляя защиту main привязанной к устаревающим именам job.
  required:
    name: CI
    if: ${{ always() }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require the entire verification matrix
        env:
          MATRIX_RESULT: ${{ needs.verify.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MATRIX_RESULT" == 'success' ]]
