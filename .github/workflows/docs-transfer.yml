name: Apply verified documentation patch
on:
  push:
    branches: [docs/document-integrity-20260906]
permissions:
  contents: read
jobs:
  apply:
    if: github.event_name == 'push' && github.actor == 'lemone112' && github.repository_id == '1283156766' && github.ref == 'refs/heads/docs/document-integrity-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and apply the exact pre-tested patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 3323c2d02a6c759fa72717801f6fd7760cef0987
          case "$(git remote get-url origin)" in
            https://github.com/Labpics-Team/lab-icons|https://github.com/Labpics-Team/lab-icons.git) ;;
            *) exit 1 ;;
          esac
          printf '%s\n' .docs-transfer.patch .github/workflows/docs-transfer.yml > "$RUNNER_TEMP/expected-files"
          git diff --name-only HEAD^ HEAD > "$RUNNER_TEMP/actual-files"
          diff -u "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/actual-files"
          printf '%s\n' '2cb4f18386c0c42f4dcf33add369c498d8883c4193893c6ba90889dfc3be6658  .docs-transfer.patch' | sha256sum -c -
          git -c core.hooksPath=/dev/null apply --index --check --unidiff-zero .docs-transfer.patch
          git -c core.hooksPath=/dev/null apply --index --unidiff-zero .docs-transfer.patch
          git rm --cached -- .docs-transfer.patch .github/workflows/docs-transfer.yml
          test "$(git write-tree)" = ad5c750f8cd0e00b3c379aa0a79ecb139c56a408
          git reset -q HEAD -- .docs-transfer.patch .github/workflows/docs-transfer.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' -c core.hooksPath=/dev/null commit -m 'docs: align rendered diagnostics with report policy'
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
      - name: Fast-forward only this documentation branch
        shell: bash
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/docs/document-integrity-20260906
          AUTH=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH"
          remote=$(git ls-remote origin "$GITHUB_REF" | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git -c core.hooksPath=/dev/null push origin "HEAD:$GITHUB_REF"
